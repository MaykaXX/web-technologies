<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №6. Завдання 6. Попап</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
<header class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>

    <div class="apps">
        <!-- Прихований, але фокусований checkbox керує станом попапу -->
        <input class="popup-toggle" type="checkbox" id="popup-toggle" aria-label="Програми">
        <label class="popup-button" for="popup-toggle">
            <img src="../icons/popup-button.png" alt="">
        </label>

        <div class="popup">
            <div class="popup-body" tabindex="0">
                <ul class="popup-list">
                    <li><a class="popup-item" href="#"><img src="../icons/calendar.png" alt=""><span>Calendar</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/mail.png" alt=""><span>Mail</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/news.png" alt=""><span>News</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/maps.png" alt=""><span>Map</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/files.png" alt=""><span>Files</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/contacts.png" alt=""><span>Contacts</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/tanslation.png" alt=""><span>Translate</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/videos.png" alt=""><span>Videos</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/search.png" alt=""><span>Search</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/photos.png" alt=""><span>Photos</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/apps.png" alt=""><span>Apps</span></a></li>
                    <li><a class="popup-item" href="#"><img src="../icons/documents.png" alt=""><span>Documents</span></a></li>
                </ul>

                <!-- Додаткові іконки: з'являються після натискання «More» -->
                <div class="popup-extra">
                    <ul class="popup-list">
                        <li><a class="popup-item" href="#"><img src="../icons/chat.png" alt=""><span>Chat</span></a></li>
                        <li><a class="popup-item" href="#"><img src="../icons/classroom.png" alt=""><span>Classroom</span></a></li>
                        <li><a class="popup-item" href="#"><img src="../icons/collection.png" alt=""><span>Collection</span></a></li>
                        <li><a class="popup-item" href="#"><img src="../icons/mars.png" alt=""><span>Mars</span></a></li>
                        <li><a class="popup-item" href="#"><img src="../icons/blogs.png" alt=""><span>Blogs</span></a></li>
                        <li><a class="popup-item" href="#"><img src="../icons/promo.png" alt=""><span>Promos</span></a></li>
                    </ul>
                </div>
            </div>

            <div class="popup-footer">
                <input class="more-toggle" type="checkbox" id="more-toggle" aria-label="Більше програм">
                <span class="more-text">More</span>
                <span class="more-end">Even more from Kottans</span>
            </div>
        </div>
    </div>

    <a class="header-link header-bell" href="#"><img src="../icons/bell.png" alt="Сповіщення"></a>
    <a class="header-link header-avatar" href="#"><img src="../icons/favicon.png" alt="Профіль"></a>
</header>
</body>
</html>
