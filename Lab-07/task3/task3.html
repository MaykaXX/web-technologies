<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h1>New York, NY</h1>
        <p>Tuesday, April 15th</p>
        <p>Overcast</p>

        <div class="current">
            <div class="current-left">
                <img src="icons/iconfinder_weather01.png" alt="Overcast">
                <span>58<sup>°F</sup></span>
            </div>
            <div class="current-right">
                <p>Precipitation: 100%</p>
                <p>Humidity: 97%</p>
                <p>Wind: 4 mph SW</p>
                <p>Pollen Count: 36</p>
            </div>
        </div>
    </div>

    <div class="forecast">
        <div class="row">
            <b>Today</b>
            <img src="icons/iconfinder_weather02.png" alt="Rain">
            <div class="temp"><b>68°</b><span>36°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Wednesday</b>
            <img src="icons/iconfinder_weather03.png" alt="Sun">
            <div class="temp"><b>50°</b><span>39°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Thursday</b>
            <img src="icons/iconfinder_weather03.png" alt="Sun">
            <div class="temp"><b>55°</b><span>39°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Friday</b>
            <img src="icons/iconfinder_weather04.png" alt="Cloudy">
            <div class="temp"><b>54°</b><span>43°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Saturday</b>
            <img src="icons/iconfinder_weather05.png" alt="Rain">
            <div class="temp"><b>64°</b><span>46°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Sunday</b>
            <img src="icons/iconfinder_weather05.png" alt="Rain">
            <div class="temp"><b>64°</b><span>50°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>

        <div class="row">
            <b>Monday</b>
            <img src="icons/iconfinder_weather04.png" alt="Cloudy">
            <div class="temp"><b>61°</b><span>50°</span></div>
            <span class="pollen">Pollen 36</span>
        </div>
    </div>
</div>

</body>
</html>
